{% extends 'base.html' %}
{% load static %}

{% block body_class %}auth-screen{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
  <div class="form-title">
    <h2 class="text-center my-4">Editar Perfil</h2>
  </div>

  <form method="post" id="edit-form">
    {% csrf_token %}

    <div class="input-group mb-2">
      <span class="input-group-text"><i class="bi bi-person"></i></span>
      <input type="text" name="username" value="{{ user.username }}" class="form-control" placeholder="Nombre de usuario">
    </div>

    <div class="input-group mb-2">
      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
      <input type="email" name="new_email" value="{{ user.email }}" class="form-control" placeholder="Correo electronico">
    </div>

    <div class="input-group mb-2">
      <span class="input-group-text"><i class="bi bi-lock"></i></span>
      <input type="password" name="new_password" class="form-control" placeholder="Nueva contrasena (opcional)">
    </div>

    <div class="btn-submit-container">
      <button type="submit" class="btn-register">Guardar cambios</button>
    </div>

    <div class="alert alert-info mt-3" role="status">
      ¿Quieres ajustar tus preferencias editoriales? Hazlo desde el <a href="{% url 'reco_preferences' %}">Laboratorio de recomendaciones</a>.
    </div>
  </form>
</div>
{% endblock %}
