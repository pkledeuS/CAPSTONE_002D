{% extends "base.html" %}
{% load static %}

{% block body_class %}auth-screen{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-title">
        <h2 class="text-center my-4">Inicia Sesión</h2>
    </div>

    <form method="post" id="loginForm" novalidate>
        {% csrf_token %}
        
        <!-- Campo usuario -->
        <div class="form-group">
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1">
                    <i class="bi bi-person"></i>
                </span>
                <input 
                    type="text" 
                    name="username" 
                    required 
                    class="form-control" 
                    placeholder="Ingresa tu nombre de usuario"
                    aria-label="Usuario"
                    aria-describedby="basic-addon1">
            </div>
        </div>

        <!-- Campo contraseña -->
        <div class="form-group">
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1">
                    <i class="bi bi-lock"></i>
                </span>
                <input 
                    id="password" 
                    type="password" 
                    name="password" 
                    required 
                    class="form-control" 
                    placeholder="Escribe tu contraseña"
                    aria-label="Contraseña"
                    autocomplete="current-password">
            </div>
        </div>

        <!-- Checkbox: mostrar contraseña -->
        <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="showPassword">
            <label class="form-check-label" for="showPassword">Mostrar contraseña</label>
        </div>

        <!-- Checkbox: recordar usuario -->
        <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
            <label class="form-check-label" for="rememberMe">Recuérdame</label>
        </div>

        <div class="btn-submit-container">
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </div>
    </form>

    <a class="passforg" href="{% url 'password_reset_request' %}">¿Olvidaste tu contraseña?</a>
    <div class="register-container">
        <p>¿No tienes una cuenta?<br>
            <a href="{% url 'register' %}">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
