{% extends "base.html" %}
{% load static %}

{% block body_class %}auth-screen{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-title">
        <h2 class="text-center my-4">Nueva Contraseña</h2>
        <p class="text-center text-muted mb-4">Ingresa tu nueva contraseña</p>
    </div>

    <form method="post" id="passwordResetConfirmForm" novalidate>
        {% csrf_token %}
        
        <!-- Campo nueva contraseña -->
        <div class="form-group mb-3">
            <label for="new_password" class="form-label fw-semibold">Nueva contraseña</label>
            <div class="input-group mb-2">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input 
                    id="new_password"
                    type="password" 
                    name="new_password" 
                    required 
                    class="form-control password-input" 
                    placeholder="Escribe tu nueva contraseña"
                    aria-label="Nueva contraseña">
            </div>
            <small id="newPasswordFeedback" class="feedback"></small>
        </div>

        <!-- Campo confirmar contraseña -->
        <div class="form-group mb-3">
            <label for="confirm_password" class="form-label fw-semibold">Confirmar contraseña</label>
            <div class="input-group mb-2">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input 
                    id="confirm_password"
                    type="password" 
                    name="confirm_password" 
                    required 
                    class="form-control password-input" 
                    placeholder="Confirma tu nueva contraseña"
                    aria-label="Confirmar contraseña">
            </div>
            <small id="passwordFeedback" class="feedback"></small>
        </div>

        <!-- Checkbox: mostrar contraseña -->
        <div class="form-group form-check mb-3">
            <input class="form-check-input" type="checkbox" id="showPassword">
            <label class="form-check-label" for="showPassword">Mostrar contraseña</label>
        </div>

        <div class="btn-submit-container">
            <button type="submit" class="btn-login" id="submitBtn">Restablecer contraseña</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/password_reset.js' %}"></script>
{% endblock %}
