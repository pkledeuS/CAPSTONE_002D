{% extends "base.html" %}

{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
    
    <div class="form-container">
        <div class="form-title">
            <h2 class="text-center my-4">Inicia Sesión</h2>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-person"></i></span></span>
                    <input type="email" id="email" name="email" required class="form-control" placeholder="Ingresa tu Correo Electrónico" aria-label="Username" aria-describedby="basic-addon1">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-lock"></i></span>
                    <input id="pwBootstrap" type="password" class="form-control" placeholder="Escribe tu contraseña" aria-describedby="togglePassword" aria-label="Contraseña" />
                </div>
            </div>
            <div class="form-group form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                <label class="form-check-label" for="rememberMe">Recuérdame</label>
            </div>
            <div class="btn-submit-container">
                <button type="submit" class="btn-login">Iniciar sesión</button>
            </div>
        </form>
        <a class="passforg" href="forgot_password.html">¿Olvidaste tu contraseña?</a>
        <div class="register-container">
            <p>¿No tienes una cuenta?
                <br>
                <a href="register.html">Regístrate aquí</a>
            </p>
        </div>
    </div>
        
    {% block scripts %}
    <script src="{% static 'js/script.js' %}"></script>
    {% endblock %}

{% endblock %}
