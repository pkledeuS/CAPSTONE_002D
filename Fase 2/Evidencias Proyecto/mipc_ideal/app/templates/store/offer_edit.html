{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Editar oferta</h3>
<form method="post">
  {% csrf_token %}
  <div class="mb-3"><strong>Producto:</strong> {{ oferta.producto.nombre_producto }} ({{ oferta.producto.modelo_producto }})</div>
  <div class="mb-3">
    <label class="form-label">Precio (CLP)</label>
    <input type="number" step="0.01" class="form-control" name="precio" value="{{ oferta.precio }}">
  </div>
  <button class="btn btn-primary" type="submit">Guardar</button>
  <a class="btn btn-light" href="{% url 'store_offers_list' %}">Cancelar</a>
{% endblock %}
