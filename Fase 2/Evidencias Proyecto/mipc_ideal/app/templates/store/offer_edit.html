{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Editar oferta</h3>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <strong>Producto:</strong> {{ oferta.producto.nombre_producto }} 
    <br>
    <strong>Tipo de producto:</strong> {{ oferta.producto.tipo_producto }} 
    <br>
    <strong>Modelo:</strong> ({{ oferta.producto.modelo_producto }})
  </div>
  <div class="mb-3">
    <label class="form-label">Link del producto</label>
    <input type="text" class="form-control" name="link" value="{{ form_new.url_externa }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Precio (CLP)</label>
    <input type="number" step="0.01" class="form-control" name="precio" value="{{ oferta.precio }}">
  </div>
  <button class="btn btn-primary" type="submit">Guardar</button>
  <a class="btn btn-light" href="{% url 'store_offers_list' %}">Cancelar</a>
</form>
{% endblock %}
