{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Eliminar oferta</h3>
<p>¿Eliminar la oferta de <strong>{{ oferta.producto.nombre_producto }}</strong> ({{ oferta.producto.modelo_producto }})?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Eliminar</button>
  <a class="btn btn-light" href="{% url 'store_offers_list' %}">Cancelar</a>
</form>
{% endblock %}
