{% extends 'base.html' %}

{% load static %}

{% block css %}

    <link rel="stylesheet" href="{% static 'css/edit-form-profile.css' %}">

{% endblock %}

{% block content %}

    <div class="form-container">
        <div class="form-title">
            <h2 class="text-center my-4">Editar Perfil</h2>
        </div>
        <form id="edit-form">
            <div class="form-group">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Nuevo nombre de usuario" aria-label="Username" aria-describedby="basic-addon1">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon2"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="current_email" class="form-control" placeholder="Correo electrónico actual" aria-label="email" aria-describedby="basic-addon2">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon3"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="new_email" class="form-control" placeholder="Nuevo correo electrónico" aria-label="new-email" aria-describedby="basic-addon3">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon4"><i class="bi bi-lock"></i></span>
                    <input type="password" name="current_password" class="form-control" placeholder="Contraseña actual" aria-label="Contraseña" aria-describedby="basic-addon4">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon5"><i class="bi bi-lock"></i></span>
                    <input type="password" name="new_password" class="form-control" placeholder="Nueva contraseña" aria-label="Nueva contraseña" aria-describedby="basic-addon5">
                </div>
                <div class="form-title">
                    <h2 class="text-center my-4">Editar tus Preferencias</h2>
                </div>
                <form>
                    <fieldset class="form-section">
                        <legend class="form-subtitle">Productos:</legend>
                        <div class="form-check-container">
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" name="products" id="gamer" value="Dispositivos para gamers">
                                <label class="form-check-label" for="gamer">Dispositivos para gamers</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" name="products" id="estudios" value="Dispositivos para Estudios">
                                <label class="form-check-label" for="estudios">Dispositivos para Estudios</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" name="products" id="trabajo" value="Dispositivos para Trabajo">
                                <label class="form-check-label" for="trabajo">Dispositivos para Trabajo</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" name="products" id="diseno" value="Dispositivos para Diseño">
                                <label class="form-check-label" for="diseno">Dispositivos para Diseño</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" name="products" id="componentes" value="Componentes">
                                <label class="form-check-label" for="componentes">Componentes</label>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset class="form-section">
                        <legend class="form-subtitle">Tiendas:</legend>
                        <div class="form-check-container">
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" name="stores" id="mantencion" value="Mantención">
                                <label class="form-check-label" for="mantencion">Mantención</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" name="stores" id="armados" value="Armados">
                                <label class="form-check-label" for="armados">Armados</label>
                            </div>
                        </div>
                    </fieldset>
                </form>
                <div class="btn-save-container">
                    <button type="submit" class="btn-form-save">Guardar</button>
                </div>
            </div>
        </form>
    </div>

{% endblock %}
