{% extends "base.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
{% endblock %}

{% block content %}
<div class="form-container">
  <div class="form-title">
    <h2 class="text-center m-2">Registro</h2>
  </div>

  <form method="post" action="{% url 'register' %}" id="registroForm">
    {% csrf_token %}

    <div class="form-group mb-3">
      <label for="username" class="form-label fw-semibold">Nombre de usuario</label>
      <div class="input-group mb-2">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input id="username" type="text" name="username" required class="form-control" placeholder="Nombre de usuario">
      </div>
      <small id="usernameFeedback" class="feedback"></small>
    </div>

    <div class="form-group mb-3">
      <label for="email" class="form-label fw-semibold">Correo electrónico</label>
      <div class="input-group mb-2">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input id="email" type="email" name="email" required class="form-control" placeholder="correo@ejemplo.cl">
      </div>
      <small id="emailFeedback" class="feedback"></small>
    </div>

    <div class="form-group mb-3">
      <label for="password" class="form-label fw-semibold">Contraseña</label>
      <div class="input-group mb-2">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input id="password" type="password" name="password" required class="form-control" placeholder="Contraseña">
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="confirmPassword" class="form-label fw-semibold">Confirmar contraseña</label>
      <div class="input-group mb-2">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input id="confirmPassword" type="password" name="confirmPassword" required class="form-control" placeholder="Confirmar contraseña">
      </div>
      <small id="passwordFeedback" class="feedback"></small>
    </div>

    <div class="form-group form-check mb-3">
      <input class="form-check-input" type="checkbox" id="showPassword">
      <label class="form-check-label" for="showPassword">Mostrar contraseña</label>
    </div>

    <div class="btn-submit-container">
      <button type="submit" class="btn-register">Registrarse</button>
    </div>

    <div class="login-container">
      <p>¿Ya tienes cuenta?<br><a href="{% url 'login' %}">Inicia sesión aquí</a></p>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
