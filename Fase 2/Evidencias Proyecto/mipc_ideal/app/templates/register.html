{% extends "base.html" %}

{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
{% endblock %}

{% block content %}
    <div class="form-container">
        <div class="form-title">    
            <h2 class="text-center m-2">Registro</h2>
        </div>
        <form id="registroForm">
            <div class="mb-3 text-center">
                <label class="form-label d-block fw-semibold">Tipo de cuenta</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipoCuenta" id="usuario" value="usuario" checked>
                    <label class="form-check-label" for="usuario">Usuario</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipoCuenta" id="tienda" value="tienda">
                    <label class="form-check-label" for="tienda">Tienda</label>
                </div>
            </div>
        
            <div class="form-group">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon3"><i class="bi bi-person"></i></span>
                <input type="text" id="nombre" class="form-control" name="nombre" required placeholder="Nombre de Usuario">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon3"><i class="bi bi-envelope"></i></span>
                    <input type="text" id="email" class="form-control" name="email" required placeholder="Ingresa tu correo">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon3"><i class="bi bi-lock"></i></span>
                    <input id="pwBootstrap" type="password" name="password" minlength="6" required class="form-control" placeholder="Ingresa tu Contraseña" aria-describedby="togglePassword" aria-label="Contraseña" />
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon3"><i class="bi bi-lock"></i></span>
                <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required placeholder="Vuelve a ingresar tu Contraseña">    
            </div>
            </div>
            <!-- Intereses -->
            <div class="container-check-list">
                <form>
                    <fieldset class="form-section">
                        <legend class="form-subtitle">Selecciona tus Intereses</legend>
                        <div class="form-check-container">
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="gamer">
                                <label class="form-check-label" for="gamer">Para Gamers</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="estudios">
                                <label class="form-check-label" for="estudios">Para Estudios</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="trabajo">
                                <label class="form-check-label" for="trabajo">Para Trabajo</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="diseno">
                                <label class="form-check-label" for="diseno">Para Diseño</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="mantencion">
                                <label class="form-check-label" for="mantencion">Mantención</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="armados">
                                <label class="form-check-label" for="armados">Armados</label>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
            <!-- Servicios -->
            <div id="serviciosSection" class="container-check-list">
                <form>
                    <fieldset class="form-section">
                        <legend class="form-subtitle">Selecciona tus Servicios</legend>
                        <div class="form-check-container">
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="componentes">
                                <label class="form-check-label" for="componentes">Venta de Componentes</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="dispositivos">
                                <label class="form-check-label" for="dispositivos">Venta de Dispositivos</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="mantenciones">
                                <label class="form-check-label" for="mantenciones">Mantenciones</label>
                            </div>
                            <div class="form-group form-check">
                                <input class="form-check-input" type="checkbox" id="armadosTienda">
                                <label class="form-check-label" for="armadosTienda">Armados</label>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="btn-submit-container">
                <button type="submit" class="btn-register">Registrarse</button>
            </div>
        </form>
        <div class="login-container">
            <p>¿Tienes una cuenta?
                <br>
                <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    {% block scripts %}
    <script src="{% static 'js/script.js' %}"></script>
    {% endblock %}
    
{% endblock %}
